name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: unzip -q SpeedMeter.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: SpeedMeter
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedMeter-APK
          path: SpeedMeter/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat rilis (supaya APK bisa diunduh langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Speed Meter build ${{ github.run_number }}
          files: SpeedMeter/app/build/outputs/apk/debug/app-debug.apk
